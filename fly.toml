app = "twenty-crm"

primary_region = "sin"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  STORAGE_TYPE = "local"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "10s"
  grace_period = "60s"
  method = "get"
  path = "/"

[[vm]]
  memory = "4096"
  cpu_kind = "shared"
  cpus = 2

[mounts]
  source = "twenty_data"
  destination = "/data"